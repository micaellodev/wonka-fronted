<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Biometria - Wonka Asistencia</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="mobile-body">
    <div class="mobile-container">
        <div class="mobile-card">
            <h1>Registrar Biometria</h1>
            <div class="employee-info">
                <p><strong>Empleado:</strong> {{ employee_name }}</p>
                <p><strong>DNI:</strong> {{ employee_dni }}</p>
            </div>
            <p class="instruction">Presiona el boton para registrar tu huella digital o rostro en este dispositivo.</p>
            <button id="registerBtn" class="btn btn-primary btn-large">Registrar Mi Biometria</button>
            <div id="status" class="status-message" style="display:none;"></div>
            <div id="error" class="error-message" style="display:none;"></div>
        </div>
    </div>

    <script>
        const employeeId = '{{ employee_id }}';

        document.getElementById('registerBtn').addEventListener('click', async () => {
            const statusEl = document.getElementById('status');
            const errorEl = document.getElementById('error');
            statusEl.style.display = 'none';
            errorEl.style.display = 'none';

            // Registering a new biometric credential for an employee is a
            // privileged admin action (it's what previously let anyone enroll
            // a credential for any employee_id). The admin must be logged in
            // — in this same browser session — while the employee enrolls.
            const token = localStorage.getItem('token');
            if (!token) {
                errorEl.textContent = 'Debes iniciar sesion como administrador para registrar biometria.';
                errorEl.style.display = 'block';
                return;
            }

            try {
                statusEl.textContent = 'Obteniendo opciones de registro...';
                statusEl.style.display = 'block';

                const optionsResp = await fetch(`/api/admin/employees/${employeeId}/biometric-options`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (!optionsResp.ok) throw new Error('Error getting registration options');
                const options = await optionsResp.json();

                const b64ToBuf = (s) => {
                    const bin = atob(s.replace(/-/g, '+').replace(/_/g, '/'));
                    const bytes = new Uint8Array(bin.length);
                    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
                    return bytes;
                };
                const bufToB64 = (buf) => {
                    const bytes = new Uint8Array(buf);
                    let bin = '';
                    for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
                    return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
                };
                const encodeBuffers = (obj) => {
                    if (obj instanceof ArrayBuffer) return bufToB64(obj);
                    if (ArrayBuffer.isView(obj)) return bufToB64(new Uint8Array(obj.buffer, obj.byteOffset, obj.byteLength));
                    if (Array.isArray(obj)) return obj.map(encodeBuffers);
                    if (obj && typeof obj === 'object') {
                        const out = {};
                        for (const k in obj) out[k] = encodeBuffers(obj[k]);
                        return out;
                    }
                    return obj;
                };
                options.challenge = b64ToBuf(options.challenge);
                options.user.id = b64ToBuf(options.user.id);
                (options.excludeCredentials || []).forEach(c => c.id = b64ToBuf(c.id));

                statusEl.textContent = 'Por favor, usa tu huella o rostro...';

                const credential = await navigator.credentials.create({
                    publicKey: options
                });

                statusEl.textContent = 'Verificando...';

                const verifyResp = await fetch(`/api/admin/employees/${employeeId}/register-biometric`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        employee_id: employeeId,
                        credential: encodeBuffers(credential)
                    })
                });

                if (verifyResp.ok) {
                    statusEl.textContent = 'Biometria registrada exitosamente! Ya puedes marcar asistencia.';
                    statusEl.className = 'status-message success';
                    document.getElementById('registerBtn').disabled = true;
                    document.getElementById('registerBtn').textContent = 'Registrado';
                } else {
                    const err = await verifyResp.json();
                    throw new Error(err.detail || 'Error en la verificacion');
                }
            } catch (err) {
                errorEl.textContent = 'Error: ' + err.message;
                errorEl.style.display = 'block';
                statusEl.style.display = 'none';
            }
        });
    </script>
</body>
</html>

<!doctype html>
<meta charset="utf-8">
<style>
  /* Ventana transparente (main.cjs): la "tarjeta" redondeada es el único elemento visible, igual que el instalador */
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; font: 14px "Segoe UI", system-ui, sans-serif; color: #1f1f24; -webkit-app-region: drag; user-select: none }
  .card { position: absolute; left: 14px; right: 14px; top: 10px; bottom: 26px; box-sizing: border-box; padding: 28px 34px; background: #fff; border: 1px solid #f0e2e2; border-radius: 30px; box-shadow: 0 6px 22px rgba(40, 20, 20, .2) }
  .top { display: flex; align-items: center; gap: 14px }
  .top img { width: 68px; height: 68px; margin-top: -4px }
  .top b { font-size: 26px; display: block; line-height: 1.1 }
  .top span, .mod, .det { color: #8b8b96; font-size: 13px }
  .row { display: flex; justify-content: space-between; margin-top: 22px; font-size: 17px; font-weight: 600 }
  #p { color: #f4333f; font-weight: 700 }
  .mod { margin-top: 4px }
  .bar { height: 14px; border-radius: 7px; background: #f4eaea; margin-top: 14px; overflow: hidden }
  .bar i { display: block; height: 100%; width: 0; border-radius: 7px; background: linear-gradient(90deg, #f4333f, #ff7a7a); transition: width .25s ease }
  .det { margin-top: 12px }
  /* Modo carga (arranque): logo grande animado en bucle, sin barra de progreso */
  .load { display: none; flex-direction: column; align-items: center; justify-content: center; height: 100% }
  .loading .load { display: flex }
  .loading .top, .loading .row, .loading .mod, .loading .bar, .loading .det { display: none }
  .logo { position: relative; width: 120px; height: 120px }
  .logo img { width: 120px; height: 120px; animation: pulse 1.6s ease-in-out infinite }
  .logo::after { content: ""; position: absolute; inset: -10px; border-radius: 50%; border: 3px solid #f4eaea; border-top-color: #f4333f; animation: spin 1.1s linear infinite }
  .load p { margin: 22px 0 0; font-size: 15px; font-weight: 600; color: #8b8b96 }
  @keyframes pulse { 0%, 100% { transform: scale(.92) } 50% { transform: scale(1.06) } }
  @keyframes spin { to { transform: rotate(360deg) } }
</style>
<div class="card loading" id="card">
  <div class="load"><div class="logo"><img src="icon.png" alt=""></div><p>Cargando sistema…</p></div>
  <div class="top"><img src="icon.png" alt=""><div><b>Wonka Park</b><span id="ver">Actualizador</span></div></div>
  <div class="row"><span id="t">Buscando actualizaciones…</span><span id="p">0%</span></div>
  <div class="mod" id="m">Módulo 1 de 2 · Descarga</div>
  <div class="bar"><i id="b"></i></div>
  <div class="det" id="d">&nbsp;</div>
  <div class="det">No cierres esta ventana, será solo un momento.</div>
</div>
<script>
  // s = { stage: 'check' | 'download' | 'install', version, percent, transferred, total, speed } (lo envía main.cjs)
  const mb = (n) => (n / 1048576).toFixed(1).replace('.', ',')
  function set(s) {
    // 'check' y 'load' = pantalla de carga con logo; el progreso solo aparece al descargar/instalar
    card.classList.toggle('loading', s.stage === 'check' || s.stage === 'load')
    const install = s.stage === 'install'
    t.textContent = install ? 'Instalando los archivos…' : s.stage === 'check' ? 'Buscando actualizaciones…' : 'Descargando actualizaciones…'
    m.textContent = install ? 'Módulo 2 de 2 · Instalación' : 'Módulo 1 de 2 · Descarga'
    if (s.version) ver.textContent = 'Actualizando a la versión ' + s.version
    const pct = install ? 100 : s.percent || 0
    p.textContent = pct + '%'
    b.style.width = pct + '%'
    d.innerHTML = install ? 'La app se reiniciará sola' : s.total ? mb(s.transferred) + ' de ' + mb(s.total) + ' MB  ·  ' + mb(s.speed) + ' MB/s' : '&nbsp;'
  }
</script>

        tl.fromTo("#s4-bunting", { y: -260 }, { y: 0, duration: 0.7, ease: SOFT }, 19.5);
        for (var fl = 0; fl < 11; fl++) {
          tl.fromTo("#s4-flag" + fl, { rotation: -8 }, { rotation: 8, duration: 0.7, ease: "sine.inOut", yoyo: true, repeat: reps(7.6, 1.4) * 2 + 1, svgOrigin: "0 0" }, 20.2 + (fl % 3) * 0.1);

        [["#bl0", 19.95], ["#bl1", 20.1], ["#bl2", 20.0], ["#bl3", 20.15]].forEach(function (b, i) {

        tl.fromTo("#kidE", { y: 260, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: SOFT }, 20.3);
        tl.fromTo("#kidF", { y: 260, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: SOFT }, 20.42);

        words("#s4-title", 20.7, 0.09);
        tl.fromTo("#s4-pill", { y: 40, opacity: 0, scale: 0.8 }, { y: 0, opacity: 1, scale: 1, duration: 0.5, ease: POP }, 22.0);

        // ===== TRANSICIÓN 4 · todo converge al logo =====
        tl.to("#s4-inner", { scale: 0.9, opacity: 0, duration: 0.6, ease: "power2.in", transformOrigin: "50% 50%" }, 27.6);
        tl.fromTo("#s5-bg", { clipPath: "circle(0% at 50% 36%)" }, { clipPath: "circle(125% at 50% 36%)", duration: 0.7, ease: "power3.inOut" }, 27.65);

        var conv = [

        ];
        // los elementos llegan desde el centro (donde estaba la fiesta) y se ubican en el marco, dejando el logo despejado
        conv.forEach(function (c, i) {
          var t0 = 27.85 + (i % 5) * 0.08;
          tl.fromTo(c[0], { x: c[1], y: c[2], scale: 0.2, rotation: i % 2 ? 90 : -90, opacity: 0 }, { x: 0, y: 0, scale: 1, rotation: 0, opacity: 1, duration: 0.8, ease: SOFT }, t0);

        window.__timelines["renzo-wonka-promo"] = tl;
      })();
